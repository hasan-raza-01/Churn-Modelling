authors = [
    { name = "hasan-raza-01", email = "hasan.raza12003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.56",
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "gradio>=6.25.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.1",
    "numpy>=2.5.2",
    "pandas>=2.3.3",
    "plyer>=2.1.0",
    "python-box>=7.4.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "skorch>=1.4.0",
    "torch>=2.13.0",
]

[project.scripts]
churn-modelling = "churn_modelling:main"

[build-system]
